<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAYYOGA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#06060f;
  --bg2:#0d0d1a;
  --surface:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.07);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --dim:#475569;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── Ambient background ── */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.15;
  animation:drift 20s ease-in-out infinite alternate;
}
.orb-1{width:520px;height:520px;background:radial-gradient(#8b5cf6,transparent);top:-12%;left:-12%;animation-duration:22s}
.orb-2{width:420px;height:420px;background:radial-gradient(#06b6d4,transparent);top:38%;right:-18%;animation-duration:18s;animation-delay:-8s}
.orb-3{width:360px;height:360px;background:radial-gradient(#10b981,transparent);bottom:-8%;left:28%;animation-duration:25s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.12)}}

/* ── Layout ── */
.screen{position:relative;z-index:1;display:none;min-height:100vh}
.screen.active{display:block}
.container{max-width:540px;margin:0 auto;padding:0 20px}

/* ── Header ── */
.app-header{
  padding:28px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-size:20px;font-weight:800;letter-spacing:.1em;
  background:linear-gradient(135deg,#c4b5fd,#67e8f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.back-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);padding:8px 16px;border-radius:20px;
  cursor:pointer;font-size:13px;transition:all .2s;
}
.back-btn:hover{background:var(--surface2);color:var(--text)}

/* ── Home ── */
.home-hero{text-align:center;padding:36px 0 28px}
.home-hero h1{font-size:30px;font-weight:800;line-height:1.25;margin-bottom:10px}
.home-hero p{color:var(--muted);font-size:14px;line-height:1.65;max-width:300px;margin:0 auto}

/* Progress ring */
.progress-ring-wrap{display:flex;justify-content:center;margin:28px 0 36px}
.ring-container{position:relative;width:120px;height:120px}
.ring-container svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8}
.ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring-number{font-size:28px;font-weight:800}
.ring-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* ── Levels ── */
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
.levels-grid{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}

.level-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:18px;cursor:pointer;
  transition:all .22s;position:relative;overflow:hidden;
}
.level-card:hover:not(.locked){
  background:var(--surface2);transform:translateY(-2px);
}
.level-card.locked{opacity:.38;cursor:not-allowed}

.level-card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.level-icon{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.level-meta{flex:1}
.level-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.level-name{font-size:17px;font-weight:700}
.level-sub{font-size:12px;color:var(--muted);margin-top:2px}

.level-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted)}

.level-progress-bar{margin-top:12px;height:3px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.level-progress-fill{height:100%;border-radius:4px;transition:width .6s ease}

.level-badge{position:absolute;top:18px;right:18px;font-size:11px;color:var(--muted)}
.level-lock{position:absolute;top:18px;right:18px;font-size:16px;opacity:.35}

/* ── Level detail ── */
.level-detail-header{text-align:center;padding:28px 0 20px}
.level-detail-icon{font-size:50px;margin-bottom:10px}
.level-detail-name{font-size:26px;font-weight:800;margin-bottom:6px}
.level-detail-desc{font-size:13px;color:var(--muted);line-height:1.65;max-width:340px;margin:0 auto}
.focus-pills{display:flex;justify-content:center;gap:8px;margin:14px 0 28px;flex-wrap:wrap}
.focus-pill{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border)}

.session-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:16px 18px;margin-bottom:9px;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;
}
.session-card:hover:not(.locked){background:var(--surface2)}
.session-card.locked{opacity:.35;cursor:not-allowed}
.session-card.done{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}

.session-num{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;flex-shrink:0;
  background:rgba(255,255,255,.06);
}
.session-info{flex:1}
.session-name{font-size:14px;font-weight:600;margin-bottom:2px}
.session-meta{font-size:12px;color:var(--muted)}
.session-done-icon{font-size:16px;color:#10b981;display:none}
.session-card.done .session-done-icon{display:block}

/* ── Session player ── */
.session-player-wrap{padding-bottom:60px}
.session-title-bar{padding:20px 0 16px}
.session-title-bar h2{font-size:21px;font-weight:800;margin-bottom:4px}
.session-title-bar p{font-size:12px;color:var(--muted)}

/* Breathing circle */
.breathing-zone{display:flex;flex-direction:column;align-items:center;padding:28px 0}
.breath-circle{
  width:136px;height:136px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid rgba(139,92,246,.2);
}
.breath-inner{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle,rgba(139,92,246,.25),rgba(139,92,246,.06));
  transition:transform .4s ease;
}
.breath-circle.inhale .breath-inner{animation:inhale 4s ease-in-out infinite}
.breath-circle.exhale .breath-inner{animation:exhale 6s ease-in-out infinite}
@keyframes inhale{0%{transform:scale(1)}50%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes exhale{0%{transform:scale(1.18)}50%{transform:scale(.88)}100%{transform:scale(1.18)}}
.breath-label{font-size:13px;color:var(--muted);margin-top:12px}
.breath-hint{font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.03em}

/* Endel card */
.endel-card{
  background:linear-gradient(135deg,rgba(139,92,246,.09),rgba(6,182,212,.07));
  border:1px solid rgba(139,92,246,.22);
  border-radius:18px;padding:18px;margin-bottom:18px;
}
.endel-card-hdr{display:flex;align-items:center;gap:10px;cursor:pointer}
.endel-pill{
  background:rgba(139,92,246,.2);padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;color:#c4b5fd;letter-spacing:.06em;
}
.endel-hdr-title{font-size:13px;font-weight:600;flex:1}
.endel-arrow{font-size:11px;color:var(--muted);transition:transform .2s}
.endel-arrow.open{transform:rotate(180deg)}
.endel-body{padding-top:16px;display:none}
.endel-body.open{display:block}
.endel-row{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
.endel-row:last-child{margin-bottom:0}
.endel-row-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.endel-row-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.endel-row-val{font-size:13px;font-weight:500}
.endel-prompt-box{
  background:rgba(0,0,0,.28);border:1px solid var(--border);
  border-radius:10px;padding:9px 13px;font-size:12px;
  color:#c4b5fd;font-style:italic;margin-top:5px;line-height:1.55;
}
.energy-bar{height:5px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:7px}
.energy-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#8b5cf6,#06b6d4)}

/* Poses */
.poses-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.pose-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:15px;padding:16px;margin-bottom:9px;transition:all .18s;
}
.pose-card.done{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.04);opacity:.7}
.pose-hdr{display:flex;align-items:center;gap:11px;cursor:pointer}
.pose-chk{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s;cursor:pointer;
}
.pose-card.done .pose-chk{background:#10b981;border-color:#10b981}
.pose-chk-dot{width:9px;height:9px;border-radius:50%;background:transparent;transition:all .2s}
.pose-card.done .pose-chk-dot{background:#fff}
.pose-name{font-size:14px;font-weight:600;flex:1}
.pose-dur{font-size:12px;color:var(--muted);flex-shrink:0}
.pose-body{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--border)}
.pose-card.expanded .pose-body{display:block}
.pose-desc{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:10px}
.pose-tip-box{display:flex;gap:8px;background:rgba(255,255,255,.04);border-radius:10px;padding:9px 12px}
.pose-tip-icon{font-size:13px;flex-shrink:0}
.pose-tip-txt{font-size:12px;color:var(--muted);line-height:1.5}
.pose-breath-txt{font-size:12px;color:#8b5cf6;margin-top:8px;font-style:italic}

/* Complete btn */
.complete-btn{
  width:100%;padding:17px;border-radius:17px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:22px;
  transition:all .22s;letter-spacing:.02em;
}
.complete-btn.ready{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff}
.complete-btn.ready:hover{opacity:.9;transform:translateY(-1px)}
.complete-btn.done{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3);cursor:default}

/* Celebration */
.celebration{
  position:fixed;inset:0;z-index:200;
  background:rgba(6,6,15,.96);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;
}
.celebration.show{display:flex}
.cel-emoji{font-size:68px;margin-bottom:18px;animation:celPop .45s ease}
@keyframes celPop{0%{transform:scale(0)}70%{transform:scale(1.22)}100%{transform:scale(1)}}
.celebration h2{font-size:26px;font-weight:800;margin-bottom:10px}
.celebration p{color:var(--muted);font-size:14px;line-height:1.65;max-width:300px;margin-bottom:30px}
.cel-btn{
  padding:15px 38px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>
<body>

<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="container">
    <div class="app-header"><div class="logo">JAYYOGA</div></div>
    <div class="home-hero">
      <h1>Tu viaje al bienestar comienza aqui</h1>
      <p>5 niveles progresivos para fortalecer tu core, ganar flexibilidad y aprender yoga desde cero.</p>
    </div>
    <div class="progress-ring-wrap">
      <div class="ring-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"
            stroke="url(#rg)" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          <defs>
            <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-text">
          <div class="ring-number" id="ring-num">0</div>
          <div class="ring-label">de 15</div>
        </div>
      </div>
    </div>
    <div class="section-label">Tus niveles</div>
    <div class="levels-grid" id="levels-grid"></div>
  </div>
</div>

<!-- LEVEL -->
<div id="screen-level" class="screen">
  <div class="container">
    <div class="app-header">
      <div class="logo">JAYYOGA</div>
      <button class="back-btn" onclick="showHome()">&#8592; Inicio</button>
    </div>
    <div id="level-content"></div>
  </div>
</div>

<!-- SESSION -->
<div id="screen-session" class="screen">
  <div class="container">
    <div class="app-header">
      <div class="logo">JAYYOGA</div>
      <button class="back-btn" id="session-back">&#8592; Nivel</button>
    </div>
    <div id="session-content" class="session-player-wrap"></div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="celebration" id="celebration">
  <div class="cel-emoji" id="cel-emoji">&#127881;</div>
  <h2 id="cel-title">Sesion completada!</h2>
  <p id="cel-msg"></p>
  <button class="cel-btn" id="cel-btn">Continuar</button>
</div>

<script>
// ─── DATA ───────────────────────────────────────
const LEVELS=[
  {
    id:1,name:"Despertar",emoji:"🌱",sub:"Conoce tu cuerpo",color:"#10b981",
    desc:"El primer paso. Aprende a respirar con intencion, suelta tensiones acumuladas y descubre como habita tu cuerpo en el espacio.",
    focus:["Respiracion","Movilidad suave","Conciencia corporal"],
    sessions:[
      {
        id:"1-1",name:"Primera Respiracion",mins:20,
        endel:{scene:"Relax",energy:25,prompt:"Amanecer suave, brisa de costa, despertar tranquilo",tip:"Auriculares suaves. Volumen bajo (30%). Deja que el sonido sea un fondo, no el protagonista."},
        poses:[
          {name:"Postura del Nino (Balasana)",dur:"2 min",desc:"Rodillas separadas al ancho de la esterilla, pies juntos. Extiende los brazos al frente y deja caer la frente al suelo o un cojin. Respira hacia la espalda baja.",tip:"Si las caderas no llegan a los talones, pon una manta doblada entre muslos y pantorrillas.",breath:"Inhala 4 tiempos, exhala 6 tiempos"},
          {name:"Gato-Vaca (Marjaryasana)",dur:"2 min",desc:"En cuatro puntos. Inhala: arquea la espalda, levanta cabeza y coccix (vaca). Exhala: redondea la espalda, lleva menton al pecho (gato). Fluye suavemente.",tip:"Siente cada vertebra. No hay prisa. El movimiento sigue a la respiracion.",breath:"Inhala -> vaca | Exhala -> gato"},
          {name:"Torsion Supina",dur:"1.5 min cada lado",desc:"Acostado boca arriba, dobla la rodilla derecha al pecho y cruzala al lado izquierdo. Extiende el brazo derecho en T. Mira hacia la derecha. Repite al otro lado.",tip:"El hombro opuesto intenta tocar el suelo. No fuerces: la gravedad hace el trabajo.",breath:"Exhala profundo con cada respiracion para profundizar la torsion"},
          {name:"Savasana",dur:"3 min",desc:"Acostado completamente plano. Pies separados naturalmente, palmas hacia arriba. Ojos cerrados. Solo existe tu respiracion.",tip:"Esta pose es tan importante como las demas. No la saltes.",breath:"Respira natural, sin controlar"}
        ]
      },
      {
        id:"1-2",name:"Raices",mins:22,
        endel:{scene:"Relax",energy:30,prompt:"Bosque al amanecer, tierra humeda, silencio verde",tip:"Prueba sin auriculares, con el telefono en el suelo cerca de ti."},
        poses:[
          {name:"Montana (Tadasana)",dur:"2 min",desc:"De pie, pies juntos o separados al ancho de caderas. Distribuye el peso en los 4 puntos de cada pie. Activa muslos, alarga la columna, corona hacia el techo.",tip:"Cierra los ojos 30 segundos para sentir tu equilibrio real.",breath:"Inhala: crece | Exhala: enraiza"},
          {name:"Flexion hacia adelante (rodillas dobladas)",dur:"2 min",desc:"Desde montana, dobla ligeramente las rodillas y deja caer el torso. Manos en espinillas o suelo. Cabeza pesada. Balancea suavemente.",tip:"Las rodillas dobladas protegen la zona lumbar. No estires de mas.",breath:"Exhala completamente cada vez"},
          {name:"Mariposa (Baddha Konasana)",dur:"3 min",desc:"Sentado, plantas de pies juntas, rodillas hacia afuera. Sujeta los tobillos. Mantén la columna larga. Puedes inclinarte levemente hacia adelante.",tip:"No empujes las rodillas hacia abajo. Deja que la gravedad las relaje con el tiempo.",breath:"Inhala crece, exhala sueltate un poco mas"},
          {name:"Flexion sentada (rodillas dobladas)",dur:"2 min",desc:"Piernas extendidas, dobla un poco las rodillas. Extiende los brazos hacia los pies. Columna larga, no curva la espalda. Respira al abdomen.",tip:"Un cinturon o toalla alrededor de los pies te ayuda a mantener la espalda recta.",breath:"Cada exhala: intenta acercar pecho a muslos, no manos a pies"},
          {name:"Savasana",dur:"3 min",desc:"Cierra la practica. Acostado en completa quietud. Permite que el cuerpo integre todo lo que trabajaste.",tip:"Pon una almohada bajo las rodillas si la zona lumbar lo pide.",breath:"Respira natural, sin controlar"}
        ]
      },
      {
        id:"1-3",name:"Apertura",mins:25,
        endel:{scene:"Relax",energy:35,prompt:"Lago al atardecer, nubes lentas, calma total",tip:"Este es buen momento para subir un poco el volumen. Deja que el ambiente te envuelva."},
        poses:[
          {name:"Gato-Vaca con extension lateral",dur:"2 min",desc:"Desde cuatro puntos, haz gato-vaca 4 veces. Luego en posicion neutra, camina las manos a la derecha y respira al costado izquierdo. Cambia.",tip:"Siente la apertura intercostal al respirar en la posicion lateral.",breath:"Inhala hacia el costado que se abre"},
          {name:"Aguja ensartada (Thread the Needle)",dur:"1.5 min c/lado",desc:"Desde cuatro puntos, desliza el brazo derecho por el suelo hacia la izquierda. Hombro y mejilla descansan en el suelo. El brazo izquierdo puede extenderse o apoyarse.",tip:"Esta pose libera tension de hombros y parte alta de la espalda acumulada por pantallas.",breath:"Exhala profundo para liberar el hombro"},
          {name:"Estiramiento de cadera supino",dur:"2 min c/lado",desc:"Acostado, dobla la rodilla derecha al pecho. Coloca el tobillo derecho sobre el muslo izquierdo (figura 4). Entrelaza las manos detras del muslo izquierdo y acerca las piernas al pecho.",tip:"Si la cadera se resiste, mantén el pie izquierdo en el suelo.",breath:"Exhala para profundizar suavemente"},
          {name:"Bebe feliz (Ananda Balasana)",dur:"2 min",desc:"Acostado, dobla ambas rodillas al pecho. Sujeta la parte externa de los pies. Rodillas hacia el suelo a los lados del torso. Balancea si quieres.",tip:"Esta pose es un mensaje directo a tu sistema nervioso: todo esta bien.",breath:"Respira libre y natural"},
          {name:"Savasana",dur:"3 min",desc:"Cierra los ojos. Deja que el suelo te sostenga completamente. No hay nada mas que hacer.",tip:"Notaras que la savasana se vuelve mas facil con la practica.",breath:"Respira natural, sin controlar"}
        ]
      }
    ]
  },
  {
    id:2,name:"Fluir",emoji:"🌊",sub:"Encuentra el movimiento",color:"#06b6d4",
    desc:"Empieza a conectar poses, introduce el saludo al sol modificado y despierta el nucleo con movimientos controlados.",
    focus:["Saludo al sol","Core basico","Apertura de caderas"],
    sessions:[
      {
        id:"2-1",name:"Primer Flujo",mins:25,
        endel:{scene:"Focus",energy:45,prompt:"Rio en movimiento, concentracion fluida, ritmo constante",tip:"Auriculares recomendados. El ritmo de Endel Focus puede guiar el ritmo de tus movimientos."},
        poses:[

// ─── STATE ──────────────────────────────────────
let completed=new Set(JSON.parse(localStorage.getItem('jy_done')||'[]'));
let activeLevelId=null;

function save(){localStorage.setItem('jy_done',JSON.stringify([...completed]))}
function levelDone(l){return l.sessions.filter(s=>completed.has(s.id)).length}
function isLevelUnlocked(idx){
  if(idx===0)return true;
  const p=LEVELS[idx-1];
  return levelDone(p)===p.sessions.length;
}
function isSessionUnlocked(li,si){
  if(!isLevelUnlocked(li))return false;
  if(si===0)return true;
  return completed.has(LEVELS[li].sessions[si-1].id);
}

// ─── NAVIGATION ─────────────────────────────────
function showHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
  renderHome();
}
function showLevel(lid){
  activeLevelId=lid;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-level').classList.add('active');
  renderLevel(lid);
}
function showSession(sid){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-session').classList.add('active');
  document.getElementById('session-back').onclick=()=>showLevel(activeLevelId);
  renderSession(sid);
}

// ─── RENDER HOME ────────────────────────────────
function renderHome(){
  const done=completed.size,total=15;
  const pct=done/total,circ=326.7;
  document.getElementById('ring-num').textContent=done;
  document.getElementById('ring-fg').style.strokeDashoffset=circ*(1-pct);

  const grid=document.getElementById('levels-grid');
  grid.innerHTML='';
  LEVELS.forEach((level,idx)=>{
    const unlocked=isLevelUnlocked(idx);
    const ld=levelDone(level);
    const lp=ld/level.sessions.length;
    const card=document.createElement('div');
    card.className='level-card'+(unlocked?'':' locked');
    card.innerHTML=`
      ${unlocked?`<div class="level-badge">${ld}/${level.sessions.length}</div>`:`<div class="level-lock">&#128274;</div>`}
      <div class="level-card-top">
        <div class="level-icon" style="background:${level.color}1a;color:${level.color}">${level.emoji}</div>
        <div class="level-meta">
          <div class="level-num">Nivel ${level.id}</div>
          <div class="level-name">${level.name}</div>
          <div class="level-sub">${level.sub}</div>
        </div>
      </div>
      <div class="level-tags">${level.focus.map(f=>`<span class="tag">${f}</span>`).join('')}</div>
      <div class="level-progress-bar"><div class="level-progress-fill" style="width:${lp*100}%;background:${level.color}"></div></div>
    `;
    if(unlocked)card.addEventListener('click',()=>showLevel(level.id));
    grid.appendChild(card);
  });
}

// ─── RENDER LEVEL ───────────────────────────────
function renderLevel(lid){
  const level=LEVELS.find(l=>l.id===lid);
  const lidx=LEVELS.indexOf(level);
  document.getElementById('level-content').innerHTML=`
    <div class="level-detail-header">
      <div class="level-detail-icon">${level.emoji}</div>
      <div class="level-detail-name" style="color:${level.color}">${level.name}</div>
      <div class="level-detail-desc">${level.desc}</div>
      <div class="focus-pills">${level.focus.map(f=>`<span class="focus-pill" style="color:${level.color};border-color:${level.color}44">${f}</span>`).join('')}</div>
    </div>
    <div class="section-label">Sesiones</div>
    ${level.sessions.map((s,si)=>{
      const unlocked=isSessionUnlocked(lidx,si);
      const done=completed.has(s.id);
      return`<div class="session-card${unlocked?'':' locked'}${done?' done':''}" ${unlocked?`onclick="showSession('${s.id}')"`:''}>
        <div class="session-num" style="${done?`background:${level.color}22;color:${level.color}`:''}">${done?'&#10003;':si+1}</div>
        <div class="session-info">
          <div class="session-name">${s.name}</div>
          <div class="session-meta">${s.mins} min &middot; ${s.poses.length} poses</div>
        </div>
        <div class="session-done-icon">&#10003;</div>
        ${!unlocked?'<div style="font-size:15px;opacity:.35">&#128274;</div>':''}
      </div>`;
    }).join('')}
    <div style="height:40px"></div>
  `;
}

// ─── RENDER SESSION ─────────────────────────────
let breathActive=false,breathTimer=null;

function renderSession(sid){
  let session,level;
  for(const l of LEVELS){const s=l.sessions.find(s=>s.id===sid);if(s){session=s;level=l;break;}}
  const done=completed.has(sid);
  const e=session.endel;

  document.getElementById('session-content').innerHTML=`
    <div class="session-title-bar">
      <h2>${session.name}</h2>
      <p>${session.mins} min &middot; Nivel ${level.id}: ${level.name} ${level.emoji}</p>
    </div>

    <div class="endel-card">
      <div class="endel-card-hdr" onclick="toggleEndel(this)">
        <div class="endel-pill">endel</div>
        <div class="endel-hdr-title">Configura Endel para esta sesion</div>
        <div class="endel-arrow open">&#9660;</div>
      </div>
      <div class="endel-body open">
        <div class="endel-row">
          <div class="endel-row-icon">&#127925;</div>
          <div><div class="endel-row-lbl">Escena</div><div class="endel-row-val">${e.scene}</div></div>
        </div>
        <div class="endel-row">
          <div class="endel-row-icon">&#9889;</div>
          <div style="flex:1">
            <div class="endel-row-lbl">Nivel de energia (deslizador)</div>
            <div class="endel-row-val">${e.energy}%</div>
            <div class="energy-bar"><div class="energy-fill" style="width:${e.energy}%"></div></div>
          </div>
        </div>
        <div class="endel-row">
          <div class="endel-row-icon">&#128172;</div>
          <div><div class="endel-row-lbl">Prompt de ambiente</div><div class="endel-prompt-box">"${e.prompt}"</div></div>
        </div>
        <div class="endel-row">
          <div class="endel-row-icon">&#127911;</div>
          <div><div class="endel-row-lbl">Consejo de audio</div><div class="endel-row-val" style="font-size:12px;color:var(--muted)">${e.tip}</div></div>
        </div>
      </div>
    </div>

    <div class="breathing-zone">
      <div class="breath-circle" id="breath-circle" onclick="toggleBreath()" style="border-color:${level.color}33">
        <div class="breath-inner" style="background:radial-gradient(circle,${level.color}33,${level.color}08)">
          <div style="font-size:26px">${level.emoji}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">respira</div>
        </div>
      </div>
      <div class="breath-label" id="breath-label">Toca para respirar con guia</div>
      <div class="breath-hint">inhala 4s &middot; exhala 6s</div>
    </div>

    <div class="poses-title">Poses de la sesion</div>
    ${session.poses.map((p,i)=>`
      <div class="pose-card${done?' done':''}" id="pose-${i}">
        <div class="pose-hdr" onclick="togglePose(${i})">
          <div class="pose-chk" onclick="checkPose(event,${i})"><div class="pose-chk-dot"></div></div>
          <div class="pose-name">${p.name}</div>
          <div class="pose-dur">${p.dur}</div>
        </div>
        <div class="pose-body">
          <div class="pose-desc">${p.desc}</div>
          <div class="pose-tip-box"><div class="pose-tip-icon">&#128161;</div><div class="pose-tip-txt">${p.tip}</div></div>
          <div class="pose-breath-txt">&#127744; ${p.breath}</div>
        </div>
      </div>
    `).join('')}

    <button class="complete-btn ${done?'done':'ready'}" id="comp-btn" onclick="completeSession('${sid}')">
      ${done?'&#10003; Sesion completada':'Marcar sesion como completada'}
    </button>
    <div style="height:20px"></div>
  `;

  breathActive=false;
  clearTimeout(breathTimer);
  // Auto-expand first pose
  togglePose(0);
}

// ─── INTERACTIONS ────────────────────────────────
function toggleEndel(hdr){
  const body=hdr.nextElementSibling;
  const arrow=hdr.querySelector('.endel-arrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function togglePose(i){
  const card=document.getElementById('pose-'+i);
  if(!card)return;
  const was=card.classList.contains('expanded');
  document.querySelectorAll('.pose-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!was)card.classList.add('expanded');
}

function checkPose(e,i){
  e.stopPropagation();
  document.getElementById('pose-'+i).classList.toggle('done');
}

function toggleBreath(){
  const circle=document.getElementById('breath-circle');
  const label=document.getElementById('breath-label');
  if(!breathActive){
    breathActive=true;
    doBreath();
  } else {
    breathActive=false;
    clearTimeout(breathTimer);
    circle.className='breath-circle';
    circle.style.borderColor='rgba(139,92,246,.2)';
    label.textContent='Toca para respirar con guia';
  }
}

function doBreath(){
  if(!breathActive)return;
  const circle=document.getElementById('breath-circle');
  const label=document.getElementById('breath-label');
  circle.className='breath-circle inhale';
  label.textContent='Inhala... (4 segundos)';
  breathTimer=setTimeout(()=>{
    if(!breathActive)return;
    circle.className='breath-circle exhale';
    label.textContent='Exhala... (6 segundos)';
    breathTimer=setTimeout(doBreath,6000);
  },4000);
}

function completeSession(sid){
  if(completed.has(sid))return;
  completed.add(sid);
  save();
  const btn=document.getElementById('comp-btn');
  if(btn){btn.className='complete-btn done';btn.textContent='&#10003; Sesion completada';}

  let session,level;
  for(const l of LEVELS){const s=l.sessions.find(s=>s.id===sid);if(s){session=s;level=l;break;}}

  const allS=LEVELS.flatMap(l=>l.sessions);
  const idx=allS.findIndex(s=>s.id===sid);
  const next=allS[idx+1];
  const lvlComplete=level.sessions.every(s=>completed.has(s.id));

  const cel=document.getElementById('celebration');
  const emoji=document.getElementById('cel-emoji');
  const title=document.getElementById('cel-title');
  const msg=document.getElementById('cel-msg');
  const celBtn=document.getElementById('cel-btn');

  if(lvlComplete){
    const li=LEVELS.indexOf(level);
    const nextL=LEVELS[li+1];
    emoji.textContent=level.emoji;
    title.textContent=nextL?`Nivel ${level.name} completado!`:'Programa completado!';
    msg.textContent=nextL
      ?`Increible. Desbloqueaste el Nivel ${nextL.id}: ${nextL.name} ${nextL.emoji}. Tu cuerpo ya no es el mismo.`
      :'Has completado todo el programa JAYYOGA. Tu cuerpo, tu mente y tu respiracion te lo agradecen.';
    celBtn.textContent=nextL?`Ir al Nivel ${nextL.id}`:'Ver inicio';
    celBtn.onclick=()=>{cel.classList.remove('show');if(nextL)showLevel(nextL.id);else showHome();};
  } else {
    emoji.textContent='🧘';
    title.textContent='Sesion completada!';
    msg.textContent=next?`Excelente practica. Tu proxima sesion: "${next.name}".`:'Gran trabajo hoy.';
    celBtn.textContent='Continuar';
    celBtn.onclick=()=>{cel.classList.remove('show');showLevel(activeLevelId);};
  }
  cel.classList.add('show');
}

document.getElementById('session-back').addEventListener('click',()=>{
  breathActive=false;clearTimeout(breathTimer);
});

// ─── INIT ───────────────────────────────────────
renderHome();
</script>
</body>
</html>
